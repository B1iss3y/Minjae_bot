name: Deploy Minjae Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: | 
            set -e
            cd /home/ubuntu/Minjae_bot
            git fetch origin
            git reset --hard origin/main
            /home/ubuntu/Minjae_bot/venv/bin/pip install -r requirements.txt
            sudo systemctl restart minjae-bot
            sudo systemctl status minjae-bot --no-pager 

