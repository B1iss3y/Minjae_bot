name: Deploy Minjae Bot

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Oracle Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/Minjae_bot
            
            echo "Updating source code..."
            git pull --ff-only origin main
            
            echo "Installing/Updating Python packages..."
            /home/ubuntu/Minjae_bot/venv/bin/pip install -r requirements.txt
            
            echo "Restarting the bot..."
            sudo systemctl restart minjae-bot
            
            echo "Checking bot status..."
            sudo systemctl status minjae-bot --no-pager
